version: "v0.4"

project:
  name: "Written on the Wall II, Conjecture 61: f(G) ≥ residue(G) + ⌈diam(G)/3⌉"
  description: >-
    A complete Lean 4 / Mathlib proof of Conjecture 61 of DeLaViña's "Written on
    the Wall II" (conjectures of Graffiti.pc): for every finite simple connected
    graph G on at least two vertices, the number f(G) of vertices of a largest
    induced forest satisfies f(G) ≥ residue(G) + ⌈diam(G)/3⌉, where residue(G) is
    the Havel–Hakimi residue of the degree sequence. The formal statement is the
    one recorded in google-deepmind/formal-conjectures
    (WrittenOnTheWallII/GraphConjecture61.lean, theorem `conjecture61`, tagged
    research open there on 26 November 2026), copied verbatim together with its
    definitions of the residue and of `largestInducedForestSize`. The proof marks
    ⌈diam/3⌉ disjoint edges on a diametral geodesic and proves a new lemma: if a
    vertex set U induces a perfect matching, there is an independent set S outside
    U with residue(G) ≤ |S| + ⌈|U \ N(S)|/2⌉. The lemma is obtained by a
    maximum-degree deletion argument with the matching re-paired in deletion
    order; the classical fact that deleting a maximum-degree vertex does not
    decrease the residue is proved from the Havel–Hakimi recursion.
  authors: ["Preetish Mishra"]
  responsible_maintainers: ["Preetish Mishra"]
  license: "Apache-2.0"

sources:
  - title: "Proof of Written on the Wall II, Conjecture 61: f(G) ≥ residue(G) + ⌈diam(G)/3⌉ for connected graphs"
    authors: ["Preetish Mishra"]
    contributors:
      - name: "OpenAI GPT-6.2 Astra"
        role: "AI system that found the proof and wrote the Lean formalization"
      - name: "Anthropic Claude Fable 5.2"
        role: "AI system that supervised the run, independently rechecked the proof and packaged the repository"
    id: "https://github.com/Sann2810/wowii61-lean"
    type: "original-proof"
    location: "PROOF.md (written argument); Wowii61/Main.lean (Lean proof)"
    relationship: "other"
    note: >-
      This repository is the first presentation of the proof. Searches on
      26 November 2026 found no earlier complete proof; the statement was tagged
      research open in formal-conjectures on that date.
  - title: "Written on the Wall II (Conjectures of Graffiti.pc), Conjecture 61"
    authors: ["Ermelinda DeLaViña"]
    id: "http://cms.uhd.edu/faculty/delavinae/research/wowII/all.html#conj61"
    type: "web discussion"
    relationship: "background"
    note: "Original statement of the conjecture."
  - title: "google-deepmind/formal-conjectures, WrittenOnTheWallII/GraphConjecture61.lean"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/WrittenOnTheWallII/GraphConjecture61.lean"
    type: "other"
    relationship: "other"
    note: >-
      Source of the formal statement and of the definitions of havelHakimiStep,
      residueAux, residue and largestInducedForestSize (copied verbatim, Apache-2.0).
  - title: "On the residue of a graph"
    authors: ["Odile Favaron", "Maryvonne Mahéo", "Jean-François Saclé"]
    id: "https://doi.org/10.1002/jgt.3190150107"
    type: "paper"
    relationship: "background"
    note: >-
      Residue is a lower bound for the independence number, and maximum-degree
      deletion does not decrease it. The deletion statement needed here is proved
      in this repository from the Havel–Hakimi recursion.
  - title: "Partial Results on the WOWII-61 Graffiti Conjecture"
    authors: ["Haoyu Chen"]
    id: "https://doi.org/10.5281/zenodo.22069069"
    type: "paper"
    relationship: "background"
    note: "Earlier partial results (August 2026); leaves the general conjecture open. Not used in this proof."

