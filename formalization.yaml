automation:
  methods:
    - method: "autonomous"
      models: ["OpenAI GPT-6.2 Astra (reasoning effort high)"]
      framework: "Codex agent in the ChatGPT desktop app"
      tool_setup: >-
        Given the nine WOWII statements then tagged research open in
        formal-conjectures and told to settle one in Lean. Ran exhaustive
        counterexample searches (nauty geng, all connected graphs up to 10
        vertices), found the matching lemma and the proof, and wrote the Lean
        proof against formal-conjectures on Lean 4.33.1 / Mathlib v4.33.1.
      cost:
        wall_time: "about 13 hours elapsed (2026-11-25 22:15 to 2026-11-26 10:45 IST), about 3 hours of active agent time"
        hardware: "one laptop"
    - method: "autonomous"
      models: ["Anthropic Claude Fable 5.2"]
      framework: "Claude Code"
      tool_setup: >-
        Supervision and independent verification: chose the target set, rebuilt
        the proof on a clean formal-conjectures checkout, checked that the proved
        type is syntactically equal to the original statement and that the axioms
        are the three standard ones. Packaging for this repository: moved the
        statement into Challenge.lean, replaced the formal-conjectures import with
        verbatim copies of the definitions, added module headers, and moved the
        project to Lean / Mathlib v4.35.0.
  spend_usd: "subscription-based usage"
  notes: "No human wrote proof code. The written argument has not been checked by hand by a human."

fidelity:
  divergences: >-
    None in the statement: it is the formal-conjectures statement verbatim. The
    Nontrivial vertex type encodes that the graph has at least two vertices.
    In the copied definitions two proofs differ and no definition changes: the
    helper lemma havelHakimiStep_length_cons is proved by rw instead of grind, and
    the redundant final omega of the termination proof of residueAux is removed.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    lake build with 0 errors; the main theorem depends only on propext,
    Classical.choice, Quot.sound. Against formal-conjectures itself the proved
    type was checked syntactically equal to the type of `conjecture61`. The
    informal argument (PROOF.md) has not been peer reviewed.

